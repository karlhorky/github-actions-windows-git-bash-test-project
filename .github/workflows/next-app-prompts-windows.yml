name: Next.js prompts in Windows Git Bash

on:
  push:
    branches:
      - test-next-app-prompts-windows
    paths:
      - .github/workflows/next-app-prompts-windows.yml
      - scripts/test-next-app-prompts-windows.py

permissions:
  contents: read

jobs:
  prompts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows pseudoterminal library
        run: python -m pip install pywinpty
      - name: Test prompts and generated projects in Git Bash
        shell: bash
        run: |
          uname -a
          bash --version
          node --version
          pnpm --version
          export TEST_GIT_BASH="$(cygpath -w "$(command -v bash)")"
          python scripts/test-next-app-prompts-windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-app-prompts-windows-results
          path: test-results/
